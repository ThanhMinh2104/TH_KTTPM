# ============================================================
#  H2 IN-MEMORY — dung de test local (khong can SQL Server)
# ============================================================
spring.datasource.male.url=jdbc:h2:mem:male_db;DB_CLOSE_DELAY=-1
spring.datasource.male.driver-class-name=org.h2.Driver
spring.datasource.male.username=root
spring.datasource.male.password=root

spring.datasource.female.url=jdbc:h2:mem:female_db;DB_CLOSE_DELAY=-1
spring.datasource.female.driver-class-name=org.h2.Driver
spring.datasource.female.username=root
spring.datasource.female.password=root

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (truy cap: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
